# HTTP → HTTPS. Единственная задача этого блока — редирект.
server {
    listen 80;
    server_name monitoring.lan;

    # ACME-challenge для Let's Encrypt оставлен без редиректа —
    # пригодится при переходе на боевой домен
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name monitoring.lan;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # только современные протоколы
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Заголовки безопасности ──────────────────────────────────────────
    # запретить открывать сайт во фрейме — защита от кликджекинга
    add_header X-Frame-Options "SAMEORIGIN" always;
    # запретить браузеру угадывать тип содержимого
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: браузер запомнит, что сюда только по HTTPS.
    # На стенде с самоподписанным сертификатом закомментировано —
    # иначе потом трудно отключить
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://grafana:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket для живых обновлений в Grafana
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
    }
}