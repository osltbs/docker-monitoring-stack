global:
  # как часто Prometheus ходит за метриками. При 15с и ~9000 рядов
  # получается около 280 отсчётов в секунду — видно на дашборде
  # «Здоровье стека», панель «Скорость записи метрик»
  scrape_interval: 15s
  # как часто вычисляются правила из rule_files
  evaluation_interval: 15s

# Правила оповещения. Prometheus их ВЫЧИСЛЯЕТ и показывает на /alerts,
# но уведомлений не шлёт — для этого нужен Alertmanager, которого в стеке нет.
# Рабочие алерты ведутся средствами Grafana, см. grafana/provisioning/alerting/
rule_files:
  - /etc/prometheus/rules/*.yml

# Цели опроса. Имена сервисов резолвятся встроенным DNS Docker (127.0.0.11)
# в сети проекта — работает только в user-defined сетях, на дефолтном мосту нет
scrape_configs:
  # сам Prometheus: размер базы, скорость записи, длительность сборов
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # метрики хоста: процессор, память, диск, сеть, часы
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # метрики Loki: сколько строк принято, размер индекса, длительность запросов
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  # метрики контейнеров из cgroups: потребление по каждому, лимиты, перезапуски
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # метрики Grafana: вычисленные правила, отправленные уведомления, ошибки
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  # метрики promtail: прочитано, отправлено, потеряно строк
  - job_name: promtail
    static_configs:
      - targets: ['promtail:9080']