# Политика маршрутизации уведомлений — куда и как часто отправлять
# сработавшие алерты.
#
# Здесь одна корневая политика: всё идёт в единственную точку контакта.
# При нескольких получателях появились бы вложенные routes с условиями
# по меткам — например, critical в телеграм, warning на почту.
apiVersion: 1

policies:
  - orgId: 1
    # имя точки контакта из contactpoints.yml. Должно совпадать посимвольно,
    # иначе Grafana не запустится
    receiver: telegram

    # по каким меткам объединять алерты в одно сообщение.
    # Три сработавших правила из одной папки приедут одним уведомлением,
    # а не тремя
    group_by:
      - alertname
      - grafana_folder

    # подождать после первого срабатывания — вдруг придут ещё однотипные,
    # и отправить их вместе
    group_wait: 30s

    # как часто досылать обновления по уже открытой группе,
    # если в неё добавились новые алерты
    group_interval: 5m

    # как часто напоминать, если проблема не ушла.
    # Четыре часа, чтобы не превратить телефон в сирену
    repeat_interval: 4h