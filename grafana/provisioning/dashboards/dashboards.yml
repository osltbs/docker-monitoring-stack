# Провайдер дашбордов — говорит Grafana, откуда брать JSON-файлы.
# Сами дашборды в ../../dashboards/, описание панелей там же в README.md
apiVersion: 1

providers:
  - name: Инфраструктура
    # организация Grafana; при одной инсталляции всегда 1
    orgId: 1
    # папка в интерфейсе, куда попадут дашборды. Создаётся автоматически
    folder: Инфраструктура
    # источник — файлы на диске (есть и другие типы)
    type: file
    # false: дашборд, удалённый из каталога, остаётся в базе Grafana.
    # true удаляло бы его вместе с файлом
    disableDeletion: false
    # как часто перечитывать каталог. Правки в JSON видны через полминуты,
    # перезапускать контейнер не нужно
    updateIntervalSeconds: 30
    # запрет правки через интерфейс: единственный источник правды — файл в Git.
    # Изменения через UI жили бы в базе внутри тома и терялись при пересоздании
    allowUiUpdates: false
    options:
      # путь ВНУТРИ контейнера. Должен совпадать с точкой монтирования
      # в compose.yaml: ./grafana/dashboards:/etc/grafana/dashboards:ro
      path: /etc/grafana/dashboards
      # false: все дашборды в одну папку. true создавало бы папки
      # по структуре подкаталогов
      foldersFromFilesStructure: false