# Источники данных Grafana через provisioning.
#
# Заданы файлом, а не кликами в интерфейсе: настройка через UI живёт в базе
# Grafana внутри тома, в Git её нет, и при пересоздании тома теряется.
#
# apiVersion — версия формата этого файла, не версия Grafana. Всегда 1.
apiVersion: 1

datasources:
  - name: Prometheus
    # uid задан явно, а не сгенерирован случайно: на него ссылаются панели
    # дашбордов (поле datasourceUid) и правила оповещения.
    # Если поменять — панели перестанут находить данные
    uid: prometheus
    type: prometheus
    # proxy: к источнику ходит СЕРВЕР Grafana, а не браузер пользователя.
    # Иначе имя prometheus не разрешилось бы — оно живёт только в сети Docker
    access: proxy
    # по имени сервиса, а не localhost: внутри контейнера Grafana
    # localhost — это она сама
    url: http://prometheus:9090
    # подставляется по умолчанию при создании новой панели
    isDefault: true
    jsonData:
      # показывать в разделе Alerting правила самого Prometheus
      # (prometheus/rules/alerts.yml) — только для чтения
      manageAlerts: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100