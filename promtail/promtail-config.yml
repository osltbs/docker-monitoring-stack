# promtail — агент сбора системных логов хоста.
# Драйвер логирования Docker собирает только stdout контейнеров;
# системные логи (auth.log, kern.log, ufw.log) он не видит.

server:
  # порт для метрик promtail — Prometheus скрейпит его по имени promtail:9080.
  # Наружу не публикуется
  http_listen_port: 9080

positions:
  # запоминает, до какого места дочитан каждый файл.
  # При перезапуске продолжает с той же позиции, а не с начала —
  # поэтому каталог вынесен в том, иначе после пересоздания
  # все логи приедут в Loki заново
  filename: /tmp/positions.yaml

clients:
  # по имени сервиса — работает встроенный DNS Docker в сети проекта.
  # Здесь именно http://loki:3100, а не localhost: promtail внутри контейнера,
  # в отличие от драйвера логирования, который работает на хосте
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          # метки для фильтрации в Grafana: {job="varlogs"}
          job: varlogs
          # имя хоста берётся из окружения, чтобы конфиг не был привязан
          # к конкретной машине. Требует флага -config.expand-env=true
          host: ${HOSTNAME:-unknown}
          # какие файлы читать. К каждой строке добавится метка filename
          # с полным путём — по ней фильтруются панели дашборда «Логи»
          __path__: /var/log/*log